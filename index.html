<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WeGolden Philippines</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="https://wegolden-philippines.pages.dev/en/index.html">
  <meta http-equiv="refresh" content="0; url=en/index.html">
  <script>
    (function () {
      var langs = ["en","tl"];
      var saved = null;
      try { saved = localStorage.getItem('wg-lang'); } catch (e) {}
      var nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
      var pick = saved && langs.indexOf(saved) > -1 ? saved
               : (nav === 'tl' || nav === 'fil' ? 'tl' : 'en');
      location.replace(pick + '/index.html');
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="en/index.html">WeGolden Philippines</a>…</p>
</body>
</html>
