services:
  - type: web
    name: wegolden-philippines
    runtime: static
    buildCommand: "mkdir -p build && cp -R index.html en tl assets build/"
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /en
        destination: /en/index.html
      - type: rewrite
        source: /tl
        destination: /tl/index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
